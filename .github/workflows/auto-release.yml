name: Auto Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: write
  contents: write

concurrency:
  group: auto-release-node-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release unpublished version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Plan automatic release
        id: plan
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync, spawnSync } = require("child_process");

          const relevantPaths = ["src", "package.json", "package-lock.json", "tsconfig.json", "README.md", "LICENSE"];

          function git(args, options = {}) {
            return execFileSync("git", args, { encoding: "utf8", stdio: ["ignore", "pipe", options.quiet ? "ignore" : "pipe"] }).trim();
          }

          function tagExists(tag) {
            return spawnSync("git", ["rev-parse", "-q", "--verify", `refs/tags/${tag}`], { stdio: "ignore" }).status === 0;
          }

          function currentVersion() {
            return JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          }

          function changedSinceLatestTag() {
            const latest = spawnSync("git", ["describe", "--tags", "--abbrev=0", "--match", "v[0-9]*"], { encoding: "utf8" });
            if (latest.status !== 0) {
              return ["<initial-release>"];
            }
            return git(["diff", "--name-only", `${latest.stdout.trim()}..HEAD`]).split(/\r?\n/).filter(Boolean);
          }

          function isRelevant(path) {
            return relevantPaths.some((prefix) => path === prefix || path.startsWith(`${prefix}/`));
          }

          function bumpPatch(version) {
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (!match) {
              throw new Error(`Cannot auto-bump non-standard version: ${version}`);
            }
            return `${Number(match[1])}.${Number(match[2])}.${Number(match[3]) + 1}`;
          }

          function replaceRequired(path, oldText, newText) {
            const source = fs.readFileSync(path, "utf8");
            if (!source.includes(oldText)) {
              throw new Error(`${path} does not contain the expected release version ${oldText}`);
            }
            fs.writeFileSync(path, source.replaceAll(oldText, newText));
          }

          function writeOutput(values) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(""));
          }

          const changed = changedSinceLatestTag();
          if (changed[0] !== "<initial-release>" && !changed.some(isRelevant)) {
            const version = currentVersion();
            writeOutput({ release_needed: "false", version, tag: `v${version}`, release_sha: git(["rev-parse", "HEAD"]) });
            console.log("No release-relevant SDK changes since the latest tag.");
            process.exit(0);
          }

          let version = currentVersion();
          if (tagExists(`v${version}`)) {
            const nextVersion = bumpPatch(version);
            execFileSync("npm", ["version", nextVersion, "--no-git-tag-version"], { stdio: "inherit" });
            for (const path of ["src/constants.ts", "src/control.ts"]) {
              replaceRequired(path, `ThalovantNodeSDK/${version}`, `ThalovantNodeSDK/${nextVersion}`);
            }
            git(["config", "user.name", "github-actions[bot]"]);
            git(["config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"]);
            git(["add", "package.json", "package-lock.json", "src/constants.ts", "src/control.ts"]);
            git(["commit", "-m", `release: bump Node SDK to ${nextVersion}`]);
            git(["push", "origin", "HEAD:main"]);
            version = nextVersion;
          }

          writeOutput({ release_needed: "true", version, tag: `v${version}`, release_sha: git(["rev-parse", "HEAD"]) });
          NODE

      - name: Install dependencies
        if: steps.plan.outputs.release_needed == 'true'
        run: npm ci

      - name: Run tests
        if: steps.plan.outputs.release_needed == 'true'
        run: npm test

      - name: Check package contents
        if: steps.plan.outputs.release_needed == 'true'
        run: npm pack --dry-run

      - name: Create GitHub release
        if: steps.plan.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_SHA: ${{ steps.plan.outputs.release_sha }}
        run: gh release create "$TAG" --target "$RELEASE_SHA" --title "$TAG" --notes "Release $TAG"

      - name: Dispatch package publication
        if: steps.plan.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: gh workflow run publish.yml --ref main -f tag=latest -f auth=token -f release_tag="$TAG"
