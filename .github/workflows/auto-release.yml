name: Auto Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: auto-release-node-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release unpublished version
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@thalovant/sdk
    env:
      NPM_DIST_TAG: latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Plan automatic release
        id: plan
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync, spawnSync } = require("child_process");

          const relevantPaths = ["src", "package.json", "package-lock.json", "tsconfig.json", "README.md", "LICENSE"];

          function git(args, options = {}) {
            return execFileSync("git", args, { encoding: "utf8", stdio: ["ignore", "pipe", options.quiet ? "ignore" : "pipe"] }).trim();
          }

          function tagExists(tag) {
            return spawnSync("git", ["rev-parse", "-q", "--verify", `refs/tags/${tag}`], { stdio: "ignore" }).status === 0;
          }

          function currentVersion() {
            return JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          }

          function changedSinceLatestTag() {
            const latest = spawnSync("git", ["describe", "--tags", "--abbrev=0", "--match", "v[0-9]*"], { encoding: "utf8" });
            if (latest.status !== 0) {
              return ["<initial-release>"];
            }
            return git(["diff", "--name-only", `${latest.stdout.trim()}..HEAD`]).split(/\r?\n/).filter(Boolean);
          }

          function isRelevant(path) {
            return relevantPaths.some((prefix) => path === prefix || path.startsWith(`${prefix}/`));
          }

          function bumpPatch(version) {
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (!match) {
              throw new Error(`Cannot auto-bump non-standard version: ${version}`);
            }
            return `${Number(match[1])}.${Number(match[2])}.${Number(match[3]) + 1}`;
          }

          function replace(path, oldText, newText) {
            fs.writeFileSync(path, fs.readFileSync(path, "utf8").replaceAll(oldText, newText));
          }

          function writeOutput(values) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(""));
          }

          const changed = changedSinceLatestTag();
          if (changed[0] !== "<initial-release>" && !changed.some(isRelevant)) {
            const version = currentVersion();
            writeOutput({ release_needed: "false", version, tag: `v${version}`, release_sha: git(["rev-parse", "HEAD"]) });
            console.log("No release-relevant SDK changes since the latest tag.");
            process.exit(0);
          }

          let version = currentVersion();
          if (tagExists(`v${version}`)) {
            const nextVersion = bumpPatch(version);
            execFileSync("npm", ["version", nextVersion, "--no-git-tag-version"], { stdio: "inherit" });
            replace("src/constants.ts", `ThalovantNodeSDK/${version}`, `ThalovantNodeSDK/${nextVersion}`);
            git(["config", "user.name", "github-actions[bot]"]);
            git(["config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"]);
            git(["add", "package.json", "package-lock.json", "src/constants.ts"]);
            git(["commit", "-m", `release: bump Node SDK to ${nextVersion}`]);
            git(["push", "origin", "HEAD:main"]);
            version = nextVersion;
          }

          writeOutput({ release_needed: "true", version, tag: `v${version}`, release_sha: git(["rev-parse", "HEAD"]) });
          NODE

      - name: Install dependencies
        if: steps.plan.outputs.release_needed == 'true'
        run: npm ci

      - name: Run tests
        if: steps.plan.outputs.release_needed == 'true'
        run: npm test

      - name: Check package contents
        if: steps.plan.outputs.release_needed == 'true'
        run: npm pack --dry-run

      - name: Check whether version is already on npm
        if: steps.plan.outputs.release_needed == 'true'
        id: registry
        env:
          PACKAGE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if npm view "@thalovant/sdk@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish skipped
        if: steps.plan.outputs.release_needed == 'true' && steps.registry.outputs.exists == 'true'
        run: echo "@thalovant/sdk ${{ steps.plan.outputs.version }} is already published on npm."

      - name: Publish to npm
        if: steps.plan.outputs.release_needed == 'true' && steps.registry.outputs.exists == 'false'
        run: npm publish --access public --tag "$NPM_DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm version
        if: steps.plan.outputs.release_needed == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            PUBLISHED_VERSION="$(npm view "@thalovant/sdk@$PACKAGE_VERSION" version 2>/dev/null || true)"
            if [ "$PUBLISHED_VERSION" = "$PACKAGE_VERSION" ]; then
              echo "Verified @thalovant/sdk $PACKAGE_VERSION on npm."
              exit 0
            fi
            sleep 10
          done
          echo "@thalovant/sdk $PACKAGE_VERSION was not visible on npm after waiting."
          exit 1

      - name: Create GitHub release
        if: steps.plan.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_SHA: ${{ steps.plan.outputs.release_sha }}
        run: gh release create "$TAG" --target "$RELEASE_SHA" --title "$TAG" --notes "Release $TAG"
