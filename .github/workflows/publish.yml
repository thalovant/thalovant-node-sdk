name: Publish Node Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      auth:
        description: Authentication method
        required: true
        default: trusted
        type: choice
        options:
          - trusted
          - token
      release_tag:
        description: Immutable release tag to check out and attach evidence to
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@thalovant/sdk
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      NPM_DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'latest' }}
      NPM_AUTH_METHOD: ${{ github.event_name == 'workflow_dispatch' && inputs.auth || 'token' }}
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches the package version
        if: env.RELEASE_TAG != ''
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Check whether version is already on npm
        id: registry
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@thalovant/sdk@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: npm test

      - name: Check package contents
        run: npm pack --dry-run

      - name: Build package artifact and CycloneDX SBOM
        id: artifacts
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-artifacts
          npm sbom --omit=dev --sbom-format cyclonedx > "release-artifacts/thalovant-sdk-$PACKAGE_VERSION.cdx.json"
          PACKAGE_FILE="$(npm pack --pack-destination release-artifacts --json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const parsed = JSON.parse(input); const entry = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0]; if (!entry?.filename) throw new Error("npm pack did not return a package filename"); console.log(entry.filename); });')"
          echo "tarball=$GITHUB_WORKSPACE/release-artifacts/$PACKAGE_FILE" >> "$GITHUB_OUTPUT"
          echo "sbom=$GITHUB_WORKSPACE/release-artifacts/thalovant-sdk-$PACKAGE_VERSION.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Attest package provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.artifacts.outputs.tarball }}

      - name: Attest package SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.artifacts.outputs.tarball }}
          sbom-path: ${{ steps.artifacts.outputs.sbom }}

      - name: Publish skipped
        if: steps.registry.outputs.exists == 'true'
        run: echo "@thalovant/sdk ${{ steps.version.outputs.version }} is already published on npm."

      - name: Publish with npm token
        if: steps.registry.outputs.exists == 'false' && env.NPM_AUTH_METHOD == 'token'
        run: npm publish "${{ steps.artifacts.outputs.tarball }}" --access public --tag "$NPM_DIST_TAG" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with trusted publishing
        if: steps.registry.outputs.exists == 'false' && env.NPM_AUTH_METHOD == 'trusted'
        run: npm publish "${{ steps.artifacts.outputs.tarball }}" --access public --tag "$NPM_DIST_TAG" --provenance

      - name: Verify npm version
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            PUBLISHED_VERSION="$(npm view "@thalovant/sdk@$PACKAGE_VERSION" version 2>/dev/null || true)"
            if [ "$PUBLISHED_VERSION" = "$PACKAGE_VERSION" ]; then
              echo "Verified @thalovant/sdk $PACKAGE_VERSION on npm."
              exit 0
            fi
            sleep 10
          done
          echo "@thalovant/sdk $PACKAGE_VERSION was not visible on npm after waiting."
          exit 1

      - name: Attach package and SBOM to the GitHub release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.artifacts.outputs.tarball }}
          SBOM: ${{ steps.artifacts.outputs.sbom }}
        run: |
          EXISTING_ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for artifact in "$TARBALL" "$SBOM"; do
            name="$(basename "$artifact")"
            if grep -Fxq "$name" <<< "$EXISTING_ASSETS"; then
              echo "$name is already attached to $RELEASE_TAG; preserving the existing asset."
            else
              gh release upload "$RELEASE_TAG" "$artifact"
            fi
          done
